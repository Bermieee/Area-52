name: Package Area 52 documentation

on:
  push:
    branches:
      - package/main-670da42-20260930

permissions:
  contents: read

jobs:
  package-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact merged main
        uses: actions/checkout@v4
        with:
          ref: 670da42fe8e6da29c6148f09ba2c2af23e40031b
          path: Area-52

      - name: Verify exact commit
        shell: bash
        run: test "$(git -C Area-52 rev-parse HEAD)" = "670da42fe8e6da29c6148f09ba2c2af23e40031b"

      - name: Collect documentation
        shell: bash
        run: |
          mkdir -p Area-52-Documentation
          find Area-52 -maxdepth 1 -type f \( -name '*.md' -o -name '*.txt' \) -exec cp {} Area-52-Documentation/ \;
          if [ -d Area-52/docs ]; then cp -a Area-52/docs Area-52-Documentation/docs; fi
          if [ -d Area-52/audit-20260928 ]; then cp -a Area-52/audit-20260928 Area-52-Documentation/audit-20260928; fi
          printf 'Source repository: Bermieee/Area-52\nSource main SHA: 670da42fe8e6da29c6148f09ba2c2af23e40031b\n' > Area-52-Documentation/SOURCE-SNAPSHOT.txt

      - name: Upload documentation ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Area-52-Documentation-main-670da42
          path: Area-52-Documentation
          if-no-files-found: error
          retention-days: 7
