name: Main Demo UI Validation

on:
  push:
    branches: [main]
    paths:
      - 'src/ui-core/**'
      - 'src/deployment/sillytavern-live.js'
      - 'index.js'
      - 'styles/ui-core-*.css'
      - 'tests/deployment-live-host.test.mjs'
      - 'tests/wave6*.mjs'
      - 'tests/wave7*.mjs'
      - 'tests/wave9*.mjs'
      - 'tests/wave11-*.mjs'
      - 'tests/wave12-*.mjs'
      - 'tests/wave13-*.mjs'
      - 'assembly/lanes/ui.json'
      - '.github/workflows/main-demo-ui.yml'
  workflow_dispatch:

concurrency:
  group: main-demo-ui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: PromptPlan forensics and workspace conformance
        run: node --test tests/wave6.test.mjs tests/wave7.test.mjs tests/wave9.test.mjs
      - name: Wave 12 + 13 demo acceptance
        run: node --test tests/wave12-sillytavern-host.test.mjs tests/wave13-operator-ui.test.mjs
      - name: Wave 12 + 13 lifecycle stress
        run: node tests/wave12-sillytavern-host-stress.mjs && node tests/wave13-operator-ui-stress.mjs
      - name: Installed SillyTavern host lifecycle
        run: node --test tests/deployment-live-host.test.mjs
      - name: Browser-facing UI and installed-host imports
        run: node -e "globalThis.Buffer=undefined; globalThis.process=undefined; globalThis.require=undefined; Promise.all([import('./src/ui-core/index.js'),import('./src/ui-core/wave12-sillytavern-host.js'),import('./src/ui-core/wave7-workspaces.js'),import('./src/ui-core/wave7-forensics.js'),import('./src/ui-core/wave13-floating-navigation.js'),import('./src/ui-core/wave13-operator-surfaces.js'),import('./src/deployment/sillytavern-live.js'),import('./index.js')]).then(()=>console.log('Main demo UI + installed host browser imports PASS'))"
      - name: UI and installed-host syntax
        run: (find src/ui-core tests -type f \( -name '*.js' -o -name '*.mjs' \) -print0; printf '%s\\0' index.js src/deployment/sillytavern-live.js) | xargs -0 -n1 node --check
