name: Worker 1 Speculative Warmer Validation

on:
  push:
    branches: [Development-Worker-1]
  pull_request:
    branches: [main]
    paths:
      - 'src/coprocessor/speculative-warmer.js'
      - 'src/coprocessor/speculative-warmer-coordinator.js'
      - 'src/deployment/brain.js'
      - 'tests/worker1-speculative-warmer-installed.test.mjs'
      - 'docs/SPECULATIVE_WARMER_INSTALLED_PATH.md'
      - '.github/workflows/worker1-speculative-warmer.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  AUDIT_BASE_SHA: 0632b2526435d9608b9dbb23f36446650e223821

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Exact changed-source syntax
        run: |
          node --check src/coprocessor/speculative-warmer.js
          node --check src/coprocessor/speculative-warmer-coordinator.js
          node --check src/deployment/brain.js
          node --check tests/worker1-speculative-warmer-installed.test.mjs
      - name: Installed warmer acceptance
        run: node --test tests/worker1-speculative-warmer-installed.test.mjs
      - name: Scene prefetch and Event Spine regressions
        shell: bash
        run: |
          set +e
          node --test tests/worker1-scene-prefetch-trigger.mjs tests/worker1-scene-event-spine.mjs > /tmp/head-scene.log 2>&1
          HEAD_RC=$?
          set -e
          cat /tmp/head-scene.log
          if [ "$HEAD_RC" -eq 0 ]; then
            exit 0
          fi
          BASE_DIR="$(mktemp -d)"
          git worktree add --detach "$BASE_DIR" "$AUDIT_BASE_SHA"
          set +e
          (cd "$BASE_DIR" && node --test tests/worker1-scene-prefetch-trigger.mjs tests/worker1-scene-event-spine.mjs > /tmp/base-scene.log 2>&1)
          set -e
          echo "::group::Audit-baseline Scene failures"
          cat /tmp/base-scene.log
          echo "::endgroup::"
          grep '^not ok ' /tmp/head-scene.log | sed -E 's/^not ok [0-9]+ - //' | sort -u > /tmp/head-scene.fail || true
          grep '^not ok ' /tmp/base-scene.log | sed -E 's/^not ok [0-9]+ - //' | sort -u > /tmp/base-scene.fail || true
          comm -23 /tmp/head-scene.fail /tmp/base-scene.fail > /tmp/new-scene.fail
          echo "Head failures:"
          cat /tmp/head-scene.fail
          echo "Audit-baseline failures:"
          cat /tmp/base-scene.fail
          if [ -s /tmp/new-scene.fail ]; then
            echo "New #77-adjacent Scene failures:"
            cat /tmp/new-scene.fail
            exit 1
          fi
          echo "Scene failures are a subset of the audited starting baseline; no #77 regression added."
      - name: Runtime lifecycle and deployment integration
        shell: bash
        run: |
          set +e
          node --test tests/scene-async-runtime-lifecycle.mjs tests/deployment-brain.integration.test.mjs > /tmp/head-runtime-deployment.log 2>&1
          HEAD_RC=$?
          set -e
          cat /tmp/head-runtime-deployment.log
          if [ "$HEAD_RC" -eq 0 ]; then
            exit 0
          fi
          BASE_DIR="$(mktemp -d)"
          git worktree add --detach "$BASE_DIR" "$AUDIT_BASE_SHA"
          set +e
          (cd "$BASE_DIR" && node --test tests/scene-async-runtime-lifecycle.mjs tests/deployment-brain.integration.test.mjs > /tmp/base-runtime-deployment.log 2>&1)
          set -e
          echo "::group::Audit-baseline Runtime/deployment failures"
          cat /tmp/base-runtime-deployment.log
          echo "::endgroup::"
          grep '^not ok ' /tmp/head-runtime-deployment.log | sed -E 's/^not ok [0-9]+ - //' | sort -u > /tmp/head-runtime-deployment.fail || true
          grep '^not ok ' /tmp/base-runtime-deployment.log | sed -E 's/^not ok [0-9]+ - //' | sort -u > /tmp/base-runtime-deployment.fail || true
          comm -23 /tmp/head-runtime-deployment.fail /tmp/base-runtime-deployment.fail > /tmp/new-runtime-deployment.fail
          if [ -s /tmp/new-runtime-deployment.fail ]; then
            echo "New Runtime/deployment failures:"
            cat /tmp/new-runtime-deployment.fail
            exit 1
          fi
          echo "Runtime/deployment failures are a subset of the audited starting baseline; no #77 regression added."
      - name: Dense eligibility retrieval Truth and delivery regressions
        run: node --test tests/coprocessor-wave7-adaptive-retrieval.test.mjs tests/coprocessor-wave9-retrieval-truth.test.mjs tests/worker1-brain-context-delivery-completion.mjs tests/worker3-brain-retrieval-completion.mjs
      - name: Existing Wave 12 warmer regression
        run: npm run test:wave12
      - name: Existing Wave 12 measured report
        run: npm run report:wave12

  broad:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full syntax
        run: npm run check
      - name: Full regression
        shell: bash
        run: |
          set +e
          npm test > /tmp/head-full.log 2>&1
          HEAD_RC=$?
          set -e
          cat /tmp/head-full.log
          if [ "$HEAD_RC" -eq 0 ]; then
            exit 0
          fi
          BASE_DIR="$(mktemp -d)"
          git worktree add --detach "$BASE_DIR" "$AUDIT_BASE_SHA"
          set +e
          (cd "$BASE_DIR" && npm test > /tmp/base-full.log 2>&1)
          set -e
          echo "::group::Audit-baseline full-regression failures"
          cat /tmp/base-full.log
          echo "::endgroup::"
          grep '^not ok ' /tmp/head-full.log | sed -E 's/^not ok [0-9]+ - //' | sort -u > /tmp/head-full.fail || true
          grep '^not ok ' /tmp/base-full.log | sed -E 's/^not ok [0-9]+ - //' | sort -u > /tmp/base-full.fail || true
          comm -23 /tmp/head-full.fail /tmp/base-full.fail > /tmp/new-full.fail
          echo "Head failure count: $(wc -l < /tmp/head-full.fail)"
          echo "Audit-baseline failure count: $(wc -l < /tmp/base-full.fail)"
          if [ -s /tmp/new-full.fail ]; then
            echo "New full-regression failures:"
            cat /tmp/new-full.fail
            exit 1
          fi
          echo "Full-regression failures are a subset of the audited starting baseline; no #77 regression added."
