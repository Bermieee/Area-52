name: Scene Intelligence Completion

on:
  push:
    branches: [Development-Scene-Scanner]
    paths:
      - 'src/scene/**'
      - 'src/native-brain.js'
      - 'src/deployment/owner-graph-adapters.js'
      - 'src/deployment/brain.js'
      - 'src/deployment/sillytavern-live.js'
      - 'tests/scene-completion-wave4.mjs'
      - 'tests/scene-completion-wave4-stress.mjs'
      - 'tests/scene-completion-wave4-gaps.mjs'
      - 'tests/scene-ft002-host-e2e.mjs'
      - 'tests/deployment-live-host.test.mjs'
      - 'tests/scene-browser-load-harness.html'
      - 'scripts/scene-research-evaluation.mjs'
      - 'docs/SCENE_*'
      - '.github/workflows/scene-intelligence-completion.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/scene/**'
      - 'src/native-brain.js'
      - 'src/deployment/owner-graph-adapters.js'
      - 'src/deployment/brain.js'
      - 'src/deployment/sillytavern-live.js'
      - 'tests/scene-completion-wave4.mjs'
      - 'tests/scene-completion-wave4-stress.mjs'
      - 'tests/scene-completion-wave4-gaps.mjs'
      - 'tests/scene-browser-load-harness.html'
      - 'scripts/scene-research-evaluation.mjs'
      - 'docs/SCENE_*'
      - '.github/workflows/scene-intelligence-completion.yml'
  workflow_dispatch:

jobs:
  exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Record exact tested head
        run: |
          echo "TESTED_HEAD=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Scene completion contracts
        run: node --test tests/scene-completion-wave4.mjs
      - name: Scene completion stress
        run: node --test tests/scene-completion-wave4-stress.mjs
      - name: Scene remaining-gap regressions
        run: node --test tests/scene-completion-wave4-gaps.mjs
      - name: FT002 host lifecycle acceptance
        run: node --test tests/scene-ft002-host-e2e.mjs
      - name: Assembled selected-turn Scene delivery seam
        run: node --test --test-name-pattern='real native Brain host event publishes Scene and sealed Context Delivery' tests/deployment-live-host.test.mjs
      - name: Scene research evaluation
        run: node scripts/scene-research-evaluation.mjs
      - name: Real browser load qualification
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium-browser || command -v chromium || true)"
          test -n "$CHROME"
          python3 -m http.server 8765 >/tmp/area52-scene-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-background-timer-throttling --enable-precise-memory-info --js-flags=--expose-gc --virtual-time-budget=30000 --dump-dom http://127.0.0.1:8765/tests/scene-browser-load-harness.html | tee /tmp/area52-scene-browser.html
          grep -q 'data-status="PASS"' /tmp/area52-scene-browser.html
      - name: Preserve accepted Scene suites
        run: node --test tests/scene-*.mjs tests/scene-core-integration-wave10.mjs
      - name: Preserve shared Scene Jev seam
        run: node --test tests/coprocessor-wave9-scene.test.mjs
      - name: Browser-facing imports
        run: node -e "globalThis.Buffer=undefined; Promise.all([import('./src/scene/index.js'),import('./src/native-brain.js'),import('./src/ui-core/wave6-production-adapters.js')]).then(()=>console.log('SCENE COMPLETION IMPORT PASS'))"
      - name: Changed-surface syntax
        run: |
          find src/scene -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check src/native-brain.js
          node --check src/deployment/owner-graph-adapters.js
          node --check src/deployment/brain.js
          node --check src/deployment/sillytavern-live.js
          node --check tests/scene-completion-wave4.mjs
          node --check tests/scene-completion-wave4-stress.mjs
          node --check tests/scene-completion-wave4-gaps.mjs
          node --check tests/scene-ft002-host-e2e.mjs
          node --check tests/deployment-live-host.test.mjs
          node --check scripts/scene-research-evaluation.mjs
