name: Lore Wave 2 CI

on:
  push:
    branches:
      - Development-Lorebook-Editor
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lore-wave2:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wave 1 regression
        run: npm run test:wave1

      - name: Wave 2 representation focused suite
        run: npm run test:wave2

      - name: Browser-like production portability
        run: node --test tests/lore-browser-safe.mjs

      - name: Wave 1 stress regression
        run: npm run test:stress:wave1

      - name: Wave 2 representation stress
        run: npm run test:stress:wave2

      - name: JavaScript syntax
        shell: bash
        run: |
          for f in src/*.js tests/*.mjs; do
            node --check "$f"
          done

      - name: ESM module import
        run: node -e "Promise.all(['lore-contracts','lore-source-registry','lore-study-engine','lore-study-runtime','lore-representation-contracts','lore-representation-compiler','lore-representation-registry','lore-multi-resolution'].map(x => import('./src/' + x + '.js'))).then(() => console.log('LORE_WAVE2_ESM_IMPORT_PASS'))"
