name: Development Deployment Assembly

on:
  push:
    branches: [Development-Deployment, main]
  workflow_dispatch:

concurrency:
  group: development-deployment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deployment syntax
        run: find src/deployment -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - name: Focused deployment vertical slice
        run: node --test tests/deployment-brain.integration.test.mjs
      - name: Reproducible deployment demo evidence
        run: node scripts/development-deployment-demo.mjs

  repairs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Worker 4 focused repairs
        run: node --test tests/worker4-lore190-repro.test.mjs tests/worker4-jev211-repro.test.mjs

  lore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Accepted Lore regressions
        run: node --test tests/lore-wave1.mjs tests/lore-wave2.mjs tests/lore-wave3.mjs tests/lore-wave1-stress.mjs tests/lore-wave2-stress.mjs tests/lore-wave3-stress.mjs

  scene:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Accepted Scene regressions
        run: node --test tests/scene-*.mjs

  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Accepted Runtime regressions
        run: node --test tests/runtime*.mjs

  memory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Accepted Memory Wave 1+2+3+4 regressions and stress
        run: node --test tests/memory-wave1.mjs tests/memory-wave2.mjs tests/memory-wave3.mjs tests/memory-wave4.mjs tests/memory-wave1-stress.mjs tests/memory-wave2-stress.mjs tests/memory-wave3-stress.mjs tests/memory-wave4-stress.mjs

  coprocessor:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Typed OpenRouter Jev Decisions transport
        run: node --test tests/openrouter-jev-decisions.test.mjs
      - name: Coprocessor Wave 4 + 13 + 14 routing, connection, and provider regressions
        run: node --test tests/coprocessor-wave4.test.mjs tests/coprocessor-wave13-browser.test.mjs tests/coprocessor-wave13-choice.test.mjs tests/coprocessor-wave13-evaluation.test.mjs tests/coprocessor-wave13-stress.test.mjs tests/coprocessor-wave14-browser.test.mjs tests/coprocessor-wave14-connections.test.mjs tests/coprocessor-wave14-evaluation.test.mjs

  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: UI live binding, SillyTavern host, and Wave 13 operator regressions
        run: node --test tests/wave11-live-bindings.test.mjs tests/wave11-live-bindings-stress.mjs tests/wave12-sillytavern-host.test.mjs tests/wave12-sillytavern-host-stress.mjs tests/wave13-operator-ui.test.mjs tests/wave13-operator-ui-stress.mjs

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Browser-facing deployment imports
        run: |
          node -e "globalThis.Buffer=undefined; Promise.all([import('./src/deployment/index.js'),import('./src/memory-temporal-producer.js'),import('./src/ui-core/index.js'),import('./src/ui-core/wave12-sillytavern-host.js'),import('./src/ui-core/wave13-operator-adapters.js'),import('./src/coprocessor/resource-host-adapter.js'),import('./demo/phase2-shell/app.js')]).then(()=>console.log('Deployment browser imports PASS'))"

  manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify pinned source digests and documented integration patches
        run: node scripts/verify-development-deployment.mjs

  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Full assembled syntax
        run: npm run check

  full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Full assembled regression
        run: npm test

  live-package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Host-driven live evidence package regression
        run: node --test tests/deployment-live-host.test.mjs tests/deployment-install-contract.test.mjs
      - name: Root SillyTavern extension imports without Node Buffer
        run: node -e "globalThis.Buffer=undefined; import('./index.js').then(()=>console.log('Development Deployment extension import PASS'))"
