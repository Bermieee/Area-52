name: Worker 1 Brain Causal Wave

on:
  push:
    branches: [Development-Worker-1]
    paths:
      - 'src/cognitive-choice-contracts.js'
      - 'src/cognitive-choice-controller.js'
      - 'src/model-adapters.js'
      - 'src/adaptive-context-sections.js'
      - 'src/prompt-presentation.js'
      - 'src/native-brain.js'
      - 'src/generation-publication.js'
      - 'src/result-bus.js'
      - 'src/coprocessor/openrouter-jev-decisions.js'
      - 'src/ui-core/demo-visibility.js'
      - 'src/deployment/sillytavern-live.js'
      - 'src/deployment/brain.js'
      - 'src/coprocessor/scene-observation-specialist.js'
      - 'src/coprocessor/foreground-specialists.js'
      - 'src/scene/prefetch-trigger.js'
      - 'src/scene/lifecycle-contracts.js'
      - 'src/scene/narrative-feed-adapter.js'
      - 'src/scene/event-publisher.js'
      - 'src/scene/scene-graph.js'
      - 'src/scene/scene-episode.js'
      - 'src/deployment/owner-graph-adapters.js'
      - 'src/scene/scene-lifecycle-runtime.js'
      - 'src/scene/transition-manager.js'
      - 'src/scene/scene-integration-view.js'
      - 'src/coprocessor/scene-signal-adapter.js'
      - 'src/coprocessor/speculative-warmer.js'
      - 'src/coprocessor/fanout-planner.js'
      - 'src/runtime/**'
      - 'tests/worker1-brain-lifecycle-causal-wave.mjs'
      - 'tests/worker1-context-trust-delivery.mjs'
      - 'tests/worker1-brain-context-delivery-completion.mjs'
      - 'tests/worker1-generation-performance-wiring.mjs'
      - 'tests/worker1-scene-cognition-integration.mjs'
      - 'tests/worker1-scene-prefetch-trigger.mjs'
      - 'tests/worker1-scene-event-spine.mjs'
      - 'tests/worker1-scene-graph-temporal-adjacency.mjs'
      - 'tests/worker1-scene-ft002-assembly.mjs'
      - 'tests/openrouter-jev-decisions.test.mjs'
      - 'scripts/worker1-generation-performance-benchmark.mjs'
      - 'docs/WORKER1_BRAIN_CAUSAL_RECEIPT_CONTRACT.md'
      - '.github/workflows/worker1-brain-causal-wave.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  closure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Record exact tested head
        run: |
          echo "TESTED_HEAD=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Brain lifecycle and causal acceptance
        run: node --test tests/worker1-brain-lifecycle-causal-wave.mjs
      - name: Provider presentation and context trust
        run: node --test tests/worker1-context-trust-delivery.mjs
      - name: Brain context delivery completion
        run: node --test tests/worker1-brain-context-delivery-completion.mjs
      - name: Generation performance and causal wiring
        run: node --test tests/worker1-generation-performance-wiring.mjs
      - name: Scene cognition integration
        run: node --test tests/worker1-scene-cognition-integration.mjs
      - name: Scene Prefetch Trigger #112
        run: node --test tests/worker1-scene-prefetch-trigger.mjs
      - name: Scene Event Spine #113
        run: node --test tests/worker1-scene-event-spine.mjs
      - name: Scene Graph and temporal adjacency #110
        run: node --test tests/worker1-scene-graph-temporal-adjacency.mjs
      - name: Scene FT002 production assembly #177
        run: node --test tests/worker1-scene-ft002-assembly.mjs
      - name: Preserve Runtime owner event binding
        run: >-
          node --test
          --test-name-pattern="external producer can host L2 post-turn work from GENERATION_COMPLETED"
          tests/runtime-wave2.mjs
      - name: Qualification probe contract
        run: node --test tests/openrouter-jev-decisions.test.mjs
      - name: Demo telemetry regression
        run: node --test tests/demo-visibility.test.mjs
      - name: Generation performance benchmark
        run: node scripts/worker1-generation-performance-benchmark.mjs
      - name: Preserve Cognitive Choice Wave 9
        run: node --test tests/cognitive-choice-wave9.mjs
      - name: Preserve native one-resource path
        run: >-
          node --test
          --test-name-pattern="quiet continuation|native one-resource path|Jev #211"
          tests/native-brain-identity-retrieval.mjs
      - name: Adaptive Context 4096 regression
        run: >-
          node --test
          --test-name-pattern="small and large delivery budgets"
          tests/native-brain-identity-retrieval.mjs
      - name: Syntax
        run: >-
          node --check src/cognitive-choice-contracts.js &&
          node --check src/cognitive-choice-controller.js &&
          node --check src/model-adapters.js &&
          node --check src/adaptive-context-sections.js &&
          node --check src/prompt-presentation.js &&
          node --check src/native-brain.js &&
          node --check src/generation-publication.js &&
          node --check src/result-bus.js &&
          node --check src/coprocessor/openrouter-jev-decisions.js &&
          node --check src/ui-core/demo-visibility.js &&
          node --check src/deployment/sillytavern-live.js &&
          node --check src/deployment/brain.js &&
          node --check src/coprocessor/scene-observation-specialist.js &&
          node --check src/coprocessor/foreground-specialists.js &&
          node --check src/scene/prefetch-trigger.js &&
          node --check src/scene/lifecycle-contracts.js &&
          node --check src/scene/narrative-feed-adapter.js &&
          node --check src/scene/event-publisher.js &&
          node --check src/scene/scene-graph.js &&
          node --check src/scene/scene-episode.js &&
          node --check src/deployment/owner-graph-adapters.js &&
          node --check src/scene/scene-lifecycle-runtime.js &&
          node --check src/scene/transition-manager.js &&
          node --check src/scene/scene-integration-view.js &&
          node --check src/coprocessor/scene-signal-adapter.js &&
          node --check src/coprocessor/speculative-warmer.js &&
          node --check src/coprocessor/fanout-planner.js &&
          node --check src/runtime/causal-receipts.js &&
          node --check src/runtime/obligation-reconciler.js &&
          node --check src/runtime/worker-director.js &&
          node --check src/runtime/event-spine.js &&
          node --check src/runtime/obligation-producers.js &&
          node --check tests/worker1-brain-lifecycle-causal-wave.mjs &&
          node --check tests/worker1-brain-context-delivery-completion.mjs &&
          node --check tests/worker1-generation-performance-wiring.mjs &&
          node --check tests/worker1-scene-cognition-integration.mjs &&
          node --check tests/worker1-scene-prefetch-trigger.mjs &&
          node --check tests/worker1-scene-event-spine.mjs &&
          node --check tests/worker1-scene-graph-temporal-adjacency.mjs &&
          node --check tests/worker1-scene-ft002-assembly.mjs &&
          node --check scripts/worker1-generation-performance-benchmark.mjs
      - name: Browser-facing imports
        run: >-
          node -e "globalThis.Buffer=undefined;
          Promise.all([
          import('./src/cognitive-choice-controller.js'),
          import('./src/model-adapters.js'),
          import('./src/prompt-presentation.js'),
          import('./src/native-brain.js'),
          import('./src/coprocessor/scene-observation-specialist.js'),
          import('./src/scene/prefetch-trigger.js'),
          import('./src/scene/lifecycle-contracts.js'),
          import('./src/scene/narrative-feed-adapter.js'),
          import('./src/scene/event-publisher.js'),
          import('./src/scene/scene-graph.js'),
          import('./src/scene/scene-episode.js'),
          import('./src/deployment/owner-graph-adapters.js'),
          import('./src/scene/scene-lifecycle-runtime.js'),
          import('./src/scene/scene-integration-view.js'),
          import('./src/coprocessor/scene-signal-adapter.js'),
          import('./src/coprocessor/fanout-planner.js'),
          import('./src/runtime/event-spine.js'),
          import('./src/runtime/obligation-producers.js'),
          import('./src/runtime/index.js')
          ]).then(()=>console.log('WORKER1 BRAIN CAUSAL IMPORT PASS'))"
