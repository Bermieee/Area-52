name: Scene Intelligence Wave 1+2+3 validation
on:
  push:
    branches: [Development-Scene-Scanner]
    paths:
      - 'src/scene/**'
      - 'tests/scene-*.mjs'
      - 'tests/cognitive-core.mjs'
      - 'package.json'
      - '.github/workflows/scene-intelligence-wave1.yml'
  pull_request:
    paths:
      - 'src/scene/**'
      - 'tests/scene-*.mjs'
      - 'tests/cognitive-core.mjs'
      - 'docs/AREA52_SCENE_INTELLIGENCE_*'
      - 'docs/SCENE_*'
      - 'docs/FT002_SCENE_PREFLIGHT.md'
      - 'package.json'
concurrency:
  group: scene-intelligence-${{ github.ref }}
  cancel-in-progress: true
jobs:
  scene-wave1-wave2-wave3:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run test:scene:stress
      - run: npm run check
      - run: npm run check:browser
      - run: node -e "import('./src/scene/index.js').then(()=>console.log('Scene module import PASS'))"
