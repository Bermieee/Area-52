name: Worker 3 Operator Truth Closure

on:
  push:
    branches:
      - Development-Client-Repair-3-Operator-Truth-Closure
  pull_request:
    branches:
      - Development-Client-Repair-3
  workflow_dispatch:

concurrency:
  group: worker3-operator-truth-closure-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  exact-head:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Record exact tested head
        run: |
          echo "TESTED_HEAD=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Operator truth closure acceptance
        run: node --test tests/worker3-operator-truth-closure.test.mjs
      - name: Prompt Inspector regressions
        run: node --test tests/wave7.test.mjs
      - name: Journal and activity-feed regressions
        run: node --test tests/demo-visibility.test.mjs tests/worker3-brain-trace-ui.test.mjs
      - name: Inspect, switch, regeneration, remount and narrow-view compatibility
        run: |
          node --test tests/wave13-operator-ui.test.mjs
      - name: Host compatibility and UI boundedness regressions
        run: |
          node tests/wave13-operator-ui-stress.mjs
          node --test tests/wave11-live-bindings.test.mjs
          node --test tests/wave12-sillytavern-host.test.mjs
          node --test --test-name-pattern='live host listener topology stays bounded|SceneUiReadModel' tests/deployment-live-host.test.mjs
      - name: Browser-facing imports and focused syntax
        run: |
          node --input-type=module -e "await import('./src/ui-core/index.js'); await import('./src/ui-core/demo-visibility.js'); await import('./src/ui-core/wave7-explainability.js'); await import('./src/ui-core/wave7-workspaces.js'); await import('./src/ui-core/wave13-operator-adapters.js');"
          node --check src/ui-core/demo-visibility.js
          node --check src/ui-core/operator-load-trace.js
          node --check src/ui-core/inspector.js
          node --check src/ui-core/wave6-runtime.js
          node --check src/ui-core/wave7-explainability.js
          node --check src/ui-core/wave7-workspaces.js
          node --check src/ui-core/wave8-cognition.js
          node --check src/ui-core/wave13-operator-adapters.js
          node --check src/ui-core/wave13-operator-surfaces.js
          node --check tests/worker3-operator-truth-closure.test.mjs
          node --check tests/worker3-browser-load-benchmark.mjs

  browser-before-after:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha || '142b78e4bc6d69d3e39e571951389c135c18a38e' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Record exact tested head and base
        run: |
          echo "TESTED_HEAD=$(git rev-parse HEAD)"
          echo "STACK_BASE=$BASE_SHA"
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          test "$BASE_SHA" = "142b78e4bc6d69d3e39e571951389c135c18a38e"
      - name: Install headless Chromium driver
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install chromium
      - name: Same Chromium long-turn workload before and after
        run: |
          git worktree add /tmp/area52-worker3-base "$BASE_SHA"
          node tests/worker3-browser-load-benchmark.mjs --baseline /tmp/area52-worker3-base --current "$GITHUB_WORKSPACE"
