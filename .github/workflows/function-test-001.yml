name: Phase 1 Function Test 001

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  function-test-001:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm run check
