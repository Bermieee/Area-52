        run: node --test tests/scene-async-runtime-lifecycle.mjs tests/deployment-brain.integration.test.mjs
      - name: Dense eligibility retrieval Truth and delivery regressions
        run: node --test tests/coprocessor-wave7-adaptive-retrieval.test.mjs tests/coprocessor-wave9-retrieval-truth.test.mjs tests/worker1-brain-context-delivery-completion.mjs tests/worker3-brain-retrieval-completion.mjs
      - name: Existing Wave 12 warmer regression
        run: npm run test:wave12
      - name: Existing Wave 12 measured report
        run: npm run report:wave12

