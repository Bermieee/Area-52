name: Cognitive Core CI

on:
  push:
    branches:
      - Development-Nexus
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cognitive tests
        run: npm test
      - name: Syntax checks
        run: npm run check
      - name: ESM load
        run: node -e "import('./src/cognitive-core.js').then(()=>console.log('ESM PASS'))"
      - name: Wave 3 publication acceptance report
        run: node scripts/wave3-acceptance-report.mjs
      - name: Wave 4 adaptive context acceptance report
        run: node scripts/wave4-acceptance-report.mjs
      - name: Framework Wave 1 acceptance report
        run: node scripts/framework-wave1-acceptance-report.mjs
      - name: Cognitive Audit Wave 2 acceptance report
        run: node scripts/cognitive-audit-wave2-acceptance-report.mjs
      - name: Cognitive Audit stress report
        run: node scripts/cognitive-audit-stress-report.mjs
      - name: Context Closure Wave 3 acceptance
        run: node scripts/context-closure-wave3-acceptance-report.mjs
      - name: Delivery Learning stress
        run: node scripts/delivery-learning-stress-report.mjs
      - name: Core browser-host source acceptance
        run: node scripts/framework-browser-acceptance.mjs
      - name: Core browser-runtime execution acceptance
        run: node scripts/core-browser-runtime-acceptance.mjs
      - name: Phase 1 Core closure evidence
        run: node scripts/phase1-core-closure-evidence.mjs
      - name: Phase 1 Integration Wave 4 acceptance
        run: node scripts/integration-wave4-acceptance-report.mjs
      - name: Phase 1 Integration Wave 4 stress
        run: node scripts/integration-wave4-stress-report.mjs
      - name: Knowledge Integration Wave 5 acceptance
        run: node scripts/knowledge-wave5-acceptance-report.mjs
      - name: Knowledge Integration Wave 5 stress
        run: node scripts/knowledge-wave5-stress-report.mjs
      - name: Phase 1 Integration gate evidence
        run: node scripts/phase1-integration-gate-evidence.mjs
