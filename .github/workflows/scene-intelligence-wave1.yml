name: Scene Intelligence Wave 1+2 validation
on:
  push:
    branches: [Development-Scene-Scanner]
  pull_request:
    paths:
      - 'src/scene/**'
      - 'tests/scene-*.mjs'
      - 'tests/cognitive-core.mjs'
      - 'docs/AREA52_SCENE_INTELLIGENCE_*'
      - 'docs/SCENE_INTELLIGENCE_WAVE*.md'
      - 'package.json'
jobs:
  scene-wave1-wave2:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run test:scene:stress
      - run: npm run check
      - run: npm run check:browser
      - run: node -e "import('./src/scene/index.js').then(()=>console.log('Scene module import PASS'))"
