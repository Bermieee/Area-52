name: Lore Wave 3 CI

on:
  push:
    branches:
      - Development-Lorebook-Editor
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lore-wave3:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Wave 1 regression
        run: npm run test:wave1

      - name: Wave 2 regression
        run: npm run test:wave2

      - name: Wave 3 hierarchy and retrieval focused suite
        run: npm run test:wave3

      - name: Wave 4 Lore Intelligence end-to-end acceptance
        run: npm run test:wave4

      - name: Browser-like production portability
        run: node --test tests/lore-browser-safe.mjs

      - name: Wave 1 stress regression
        run: npm run test:stress:wave1

      - name: Wave 2 stress regression
        run: npm run test:stress:wave2

      - name: Wave 3 multi-thousand hierarchy stress
        run: npm run test:stress:wave3

      - name: JavaScript syntax
        shell: bash
        run: |
          for f in src/*.js tests/*.mjs; do
            node --check "$f"
          done

      - name: ESM module import
        run: node -e "Promise.all(['lore-contracts','lore-source-registry','lore-study-engine','lore-study-runtime','lore-representation-contracts','lore-representation-compiler','lore-representation-registry','lore-multi-resolution','lore-navigation-contracts','lore-navigation-hierarchy','lore-navigation-summary-registry','lore-navigation-summary-builder','lore-contextual-retrieval','lore-hierarchy-retrieval-system','lore-intelligence-service'].map(x => import('./src/' + x + '.js'))).then(() => console.log('LORE_WAVE4_ESM_IMPORT_PASS'))"
