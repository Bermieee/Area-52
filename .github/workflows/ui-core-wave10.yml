name: UI.Core Wave 10 validation
on:
  push:
    branches: [Development-UI]
    paths:
      - 'src/ui-core/**'
      - 'styles/ui-core*.css'
      - 'demo/phase2-shell/**'
      - 'tests/wave7*.mjs'
      - 'tests/wave8*.mjs'
      - 'tests/wave9*.mjs'
      - 'tests/wave10*.mjs'
      - 'docs/UI_CORE_WAVE_10_*.md'
      - 'package.json'
      - '.github/workflows/ui-core-wave10.yml'
  pull_request:
    paths:
      - 'src/ui-core/**'
      - 'styles/ui-core*.css'
      - 'demo/phase2-shell/**'
      - 'tests/wave7*.mjs'
      - 'tests/wave8*.mjs'
      - 'tests/wave9*.mjs'
      - 'tests/wave10*.mjs'
      - 'docs/UI_CORE_WAVE_10_*.md'
      - 'package.json'
concurrency:
  group: ui-core-wave10-${{ github.ref }}
  cancel-in-progress: true
jobs:
  wave10:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Full UI.Core regression
        run: npm test
      - name: Wave 7 explainability regression
        run: npm run test:ui:wave7
      - name: Wave 8 Brain regression
        run: npm run test:ui:wave8
      - name: Wave 9 shell regression
        run: npm run test:ui:wave9
      - name: Wave 10 focused acceptance
        run: npm run test:ui:wave10
      - name: Wave 10 forensic stress
        run: npm run test:ui:wave10:stress
      - name: JavaScript syntax validation
        run: find src/ui-core demo tests -type f \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - name: Browser-facing Wave 10 source guard
        run: |
          if grep -R -nE "from ['\"]node:|\\brequire\\s*\\(|\\bprocess\\." src/ui-core/wave7-*.js demo/phase2-shell --include='*.js'; then
            echo 'Node-only dependency detected in Wave 10 browser source'
            exit 1
          fi
          node -e "globalThis.Buffer=undefined; Promise.all([import('./src/ui-core/wave7-explainability.js'),import('./src/ui-core/wave7-forensics.js'),import('./src/ui-core/wave7-workspaces.js'),import('./demo/phase2-shell/scenarios/wave10-context-trace.js')]).then(() => console.log('Wave 10 browser module import PASS'))"
      - name: UI.Core ESM import
        run: node -e "import('./src/ui-core/index.js').then(() => console.log('UI.Core Wave 10 ESM import PASS'))"
