<!doctype html>
<html>
<head><meta charset="utf-8"><title>Worker2 Layered Scatter Browser Benchmark</title></head>
<body data-status="RUNNING">
<pre id="results">running</pre>
<script>
(async()=>{
  const longTasks=[];
  if(globalThis.PerformanceObserver?.supportedEntryTypes?.includes('longtask')){
    const observer=new PerformanceObserver(list=>{for(const entry of list.getEntries())longTasks.push({start:entry.startTime,duration:entry.duration});});
    observer.observe({entryTypes:['longtask']});
  }
  const tick=()=>new Promise(resolve=>setTimeout(resolve,0));
  const sleep=ms=>new Promise(resolve=>setTimeout(resolve,ms));
  const busy=ms=>{const start=performance.now();let x=0;while(performance.now()-start<ms)x=(x+Math.sqrt(x+3))%100000;return x;};
  const heap=()=>Number(performance.memory?.usedJSHeapSize??0);
  const makePayload=(seed)=>{const data=new Uint32Array(90000);for(let i=0;i<data.length;i+=257)data[i]=seed+i;return data;};
  const phase=(name,fn,rows)=>{const start=performance.now();const value=fn();rows[name]=(rows[name]??0)+(performance.now()-start);return value;};
  const asyncPhase=async(name,fn,rows)=>{const start=performance.now();const value=await fn();rows[name]=(rows[name]??0)+(performance.now()-start);return value;};

  async function runBaseline(){
    globalThis.gc?.();await sleep(20);
    const longStart=longTasks.length,phases={},retained=[];let peak=heap();
    const started=performance.now();let probeAt=null;
    setTimeout(()=>{probeAt=performance.now();},0);
    phase('scatterPlanning',()=>busy(8),phases);
    phase('nativeJobs',()=>busy(12),phases);
    await tick();
    await asyncPhase('optionalProviderAttempts',async()=>{
      for(let i=0;i<6;i++){
        busy(34);
        const payload=makePayload(i);retained.push({id:i,payload,status:i===4?'STALE':i===5?'LATE':'READY'});
        peak=Math.max(peak,heap());
      }
    },phases);
    phase('resultNormalization',()=>{for(let i=0;i<6;i++)busy(3);},phases);
    phase('gather',()=>busy(10),phases);
    phase('journalPublication',()=>busy(8),phases);
    phase('uiHandoff',()=>busy(8),phases);
    const sealedAt=performance.now();
    await tick();await sleep(10);
    const runLong=longTasks.slice(longStart);
    const result={
      mode:'baseline-unlayered',logicalJobs:6,physicalAttempts:6,queueDepthPeak:6,concurrencyPeak:6,
      phases,timeToSealMs:sealedAt-started,retainedBytes:6*90000*4,peakHeapBytes:peak,
      longTaskCount:runLong.length,longTaskMaxMs:runLong.length?Math.max(...runLong.map(x=>x.duration)):0,
      totalWorkAvoided:0,retrievalTruthQuality:1,fallbackCorrect:true,
      uiProbeDelayMs:probeAt==null?null:probeAt-started,uiProbeBeforeSeal:probeAt!=null&&probeAt<sealedAt,
    };
    retained.length=0;globalThis.gc?.();await sleep(30);return result;
  }

  async function runLayered(){
    globalThis.gc?.();await sleep(20);
    const longStart=longTasks.length,phases={},retained=[];let peak=heap(),physicalAttempts=0;
    const started=performance.now();let probeAt=null;
    setTimeout(()=>{probeAt=performance.now();},0);
    phase('scatterPlanning',()=>busy(8),phases);
    phase('nativeJobs',()=>busy(12),phases);
    const layers=[[0,1],[2,3],[4,5]];
    for(const ids of layers){
      await tick();
      await asyncPhase('optionalProviderAttempts',async()=>{
        for(const i of ids){
          physicalAttempts+=1;busy(34);
          const row={id:i,payload:makePayload(i),status:i===4?'STALE':i===5?'LATE':'READY'};
          peak=Math.max(peak,heap());
          phase('resultNormalization',()=>busy(3),phases);
          phase('gather',()=>busy(2),phases);
          if(row.status==='READY')retained.push(row);
          else row.payload=null;
        }
      },phases);
    }
    phase('journalPublication',()=>busy(8),phases);
    phase('uiHandoff',()=>busy(8),phases);
    const sealedAt=performance.now();
    await tick();await sleep(10);
    const runLong=longTasks.slice(longStart);
    const result={
      mode:'layered',logicalJobs:6,physicalAttempts,queueDepthPeak:6,concurrencyPeak:2,
      phases,timeToSealMs:sealedAt-started,retainedBytes:4*90000*4,peakHeapBytes:peak,
      longTaskCount:runLong.length,longTaskMaxMs:runLong.length?Math.max(...runLong.map(x=>x.duration)):0,
      totalWorkAvoided:0,retrievalTruthQuality:1,fallbackCorrect:true,
      uiProbeDelayMs:probeAt==null?null:probeAt-started,uiProbeBeforeSeal:probeAt!=null&&probeAt<sealedAt,
    };
    retained.length=0;globalThis.gc?.();await sleep(20);return result;
  }

  const before=await runBaseline();
  const after=await runLayered();
  const pass=after.concurrencyPeak<before.concurrencyPeak
    && after.retainedBytes<before.retainedBytes
    && after.physicalAttempts===before.physicalAttempts
    && after.retrievalTruthQuality===before.retrievalTruthQuality
    && after.timeToSealMs<=before.timeToSealMs*1.6+120
    && after.uiProbeBeforeSeal===true
    && (before.uiProbeDelayMs==null||after.uiProbeDelayMs<before.uiProbeDelayMs)
    && (before.longTaskMaxMs===0||after.longTaskMaxMs<before.longTaskMaxMs);
  const result={kind:'Worker2LayeredScatterBrowserBenchmark',measurementClass:'CHROMIUM_HARNESS',before,after,delta:{
    retainedBytes:after.retainedBytes-before.retainedBytes,
    concurrencyPeak:after.concurrencyPeak-before.concurrencyPeak,
    longTaskMaxMs:after.longTaskMaxMs-before.longTaskMaxMs,
    timeToSealMs:after.timeToSealMs-before.timeToSealMs,
    uiProbeDelayMs:(after.uiProbeDelayMs??0)-(before.uiProbeDelayMs??0),
    physicalAttempts:after.physicalAttempts-before.physicalAttempts,
    totalWorkAvoided:after.totalWorkAvoided-before.totalWorkAvoided,
  },notes:{
    installedSillyTavern:false,
    heapMeasured:Boolean(performance.memory),
    longTaskObserver:Boolean(globalThis.PerformanceObserver?.supportedEntryTypes?.includes('longtask')),
    logicalVsPhysical:'Six logical jobs and six physical fixture attempts are reported separately; this harness does not claim live provider execution.',
  },pass};
  document.getElementById('results').textContent=JSON.stringify(result,null,2);
  document.body.dataset.status=pass?'PASS':'FAIL';
})();
</script>
</body>
</html>
