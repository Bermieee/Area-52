name: Package Area 52 documentation

on:
  push:
    branches:
      - package/main-670da42-20260930

permissions:
  contents: read

jobs:
  package-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact merged main
        uses: actions/checkout@v4
        with:
          ref: 670da42fe8e6da29c6148f09ba2c2af23e40031b
          path: Area-52

      - name: Verify exact commit
        shell: bash
        run: test "$(git -C Area-52 rev-parse HEAD)" = "670da42fe8e6da29c6148f09ba2c2af23e40031b"

      - name: Collect documentation only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p Area-52-Documentation

          find Area-52 -maxdepth 1 -type f \( -name '*.md' -o -name '*.txt' \) -exec cp {} Area-52-Documentation/ \;

          if [ -d Area-52/docs ]; then
            cp -a Area-52/docs Area-52-Documentation/docs
          fi

          if [ -d Area-52/audit-20260928 ]; then
            while IFS= read -r -d '' file; do
              rel="${file#Area-52/}"
              mkdir -p "Area-52-Documentation/$(dirname "$rel")"
              cp "$file" "Area-52-Documentation/$rel"
            done < <(find Area-52/audit-20260928 -type f \( -name '*.md' -o -name '*.txt' \) -print0)
          fi

          printf 'Source repository: Bermieee/Area-52\nSource main SHA: 670da42fe8e6da29c6148f09ba2c2af23e40031b\nScope: root Markdown/text, full docs tree, audit Markdown/text reports.\n' > Area-52-Documentation/SOURCE-SNAPSHOT.txt

      - name: Upload documentation ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Area-52-Documentation-main-670da42
          path: Area-52-Documentation
          if-no-files-found: error
          retention-days: 7
